name: Test TaskFlow
on:
  push:
    branches: [feat/taskflow-pages, feat/taskflow-web]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --check web/app.js && node --check web/store.js && node --check web/sync.js
